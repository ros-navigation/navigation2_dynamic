# upstream defaults (config/kf_hungarian.yaml) with only the frame set for this scenario
kf_hungarian_node:
  ros__parameters:
    death_threshold: 3
    global_frame: "odom"
    top_down: False
    measurement_noise_cov: [1., 1., 1.]
    error_cov_post: [1., 1., 1., 10., 10., 10.]
    process_noise_cov: [2., 2., 0.5]
    vel_filter: [0.1, 2.0]
    height_filter: [-2.0, 2.0]
    cost_filter: 1.0
